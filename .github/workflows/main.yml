
name: A workflow for my Hello World App

on:
  push:

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unit Tests
        run: mvn -Dtest=com.napier.sem.AppTest test

  IntegrationTests:
    name: Integration Tests and CodeCov
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Start database container
        run: |
          docker build -t database ./db
          docker run --name employees -dp 33060:3306 database

      - name: Wait for database
        run: |
          for i in {1..30}; do
            if docker exec employees mysqladmin ping -h 127.0.0.1 -uroot -pexample --silent; then
              echo "Database is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs employees
          exit 1

      - name: Integration Tests
        run: mvn -Dtest=com.napier.sem.AppIntegrationTest test

      - name: Upload Codecov report
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: IntegrationTests
          fail_ci_if_error: false
          verbose: true

      - name: Stop and remove database
        if: always()
        run: |
          docker stop employees || true
          docker rm employees || true
          docker image rm database || true

  build:
    name: Build and Start Using docker compose
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Package and Run docker compose
        run: |
          mvn package -DskipTests
          docker compose up --abort-on-container-exit
