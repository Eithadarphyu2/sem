
name: A workflow for my Hello World App

on:
  push:

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Run unit tests
        run: mvn -Dtest=com.napier.sem.AppTest test

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build database image
        run: docker build ./db -t employees

      - name: Start database container
        run: docker run --name employees -d -p 33060:3306 employees

      - name: Wait for database to be ready
        run: |
          for i in {1..30}; do
            if docker exec employees mysqladmin ping -h 127.0.0.1 -uroot -pexample --silent; then
              echo "Database is ready"
              exit 0
            fi
            echo "Waiting for database..."
            sleep 2
          done

          echo "Database failed to start"
          docker logs employees
          exit 1

      - name: Run integration tests
        run: mvn -Dtest=com.napier.sem.AppIntegrationTest test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: IntegrationTests
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Clean up database container
        if: always()
        run: |
          docker stop employees || true
          docker rm employees || true
          docker rmi employees || true

  build:
    name: Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build application
        run: mvn package -DskipTests

      - name: Run Docker Compose
        run: docker compose up --abort-on-container-exit
